name: Build MultiplayerMod and Package APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      NDK_DIR: ${{ github.workspace }}/.cache/android-ndk-r16b
      NDK_VERSION: r16b
      BUILD_TOOLS_VERSION: 34.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # CACHE ANDROID NDK R16B
      # ============================================================
      - name: Restore cached Android NDK r16b
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/android-ndk-r16b
          key: ${{ runner.os }}-android-ndk-${{ env.NDK_VERSION }}-v1

      - name: Download Android NDK r16b
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/.cache"

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip \
            -O "${{ github.workspace }}/.cache/android-ndk-r16b.zip"

          unzip -q \
            "${{ github.workspace }}/.cache/android-ndk-r16b.zip" \
            -d "${{ github.workspace }}/.cache"

          mv \
            "${{ github.workspace }}/.cache/android-ndk-r16b" \
            "${{ github.workspace }}/.cache/android-ndk-r16b"

      - name: Check cached NDK
        run: |
          test -f "${{ github.workspace }}/.cache/android-ndk-r16b/ndk-build"
          "${{ github.workspace }}/.cache/android-ndk-r16b/ndk-build" --version

      # ============================================================
      # ONLY REQUIRED OLD-NDK SYSTEM DEPENDENCY
      # ============================================================
      - name: Install legacy NDK dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5

      # ============================================================
      # CHECK PREINSTALLED BUILD TOOLS
      # ============================================================
      - name: Check Java
        run: |
          java -version
          keytool -help >/dev/null

      - name: Check CMake
        run: |
          cmake --version

      - name: Check Android build-tools
        run: |
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/zipalign"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -h >/dev/null
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" --version

      # ============================================================
      # CONFIGURE CMAKE
      # ============================================================
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.cache/android-ndk-r16b/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi \
            -DANDROID_PLATFORM=android-15 \
            -DANDROID_STL=gnustl_static \
            -DANDROID_TOOLCHAIN=gcc \
            -DCMAKE_BUILD_TYPE=Release

      # ============================================================
      # BUILD .SO
      # ============================================================
      - name: Build .so Library
        run: |
          cmake --build build --config Release -j2

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify generated library
        run: |
          echo "Checking built library..."
          test -f build/libmultiplayermod.so
          ls -lh build/libmultiplayermod.so

      # ============================================================
      # PACKAGE APK
      # ============================================================
      - name: Inject .so into main.zip and Sign APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

          echo "1. Preparing directory structure..."
          mkdir -p lib/armeabi

          cp build/libmultiplayermod.so \
             lib/armeabi/libmultiplayermod.so

          echo "2. Copying main.zip..."
          cp mainapk/main.zip game_unaligned.apk

          echo "3. Removing existing .so..."
          zip -d game_unaligned.apk \
            lib/armeabi/libmultiplayermod.so || true

          echo "4. Injecting new uncompressed .so..."
          zip -g -0 \
            game_unaligned.apk \
            lib/armeabi/libmultiplayermod.so

          echo "5. Aligning APK..."
          "$ZIPALIGN" \
            -f -v 4 \
            game_unaligned.apk \
            game_aligned.apk

          echo "6. Generating temporary keystore..."
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "7. Signing APK..."
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out MultiplayerMod_Signed.apk \
            game_aligned.apk

          echo "8. Verifying APK..."
          "$APKSIGNER" verify MultiplayerMod_Signed.apk

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerMod-Game-APK
          path: MultiplayerMod_Signed.apk
